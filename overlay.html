<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Overlay | Roleta de Perks</title>
    <!--
        Overlay para OBS (Fonte de Navegador).
        Cada vez que a página carrega, sorteia uma build nova.

        Parâmetros (na URL):
          role=survivor | killer     lado da build (padrão: survivor)
          mode=normal | classes      modo normal ou 1 perk por classe
          spin=0                     desliga a animação de roleta
          names=0                    esconde os nomes
          scale=1.5                  tamanho (1 = 100%)
          layout=v                   layout vertical (padrão: horizontal)
          auto=60                    sorteia sozinho a cada 60 segundos

        Exemplos:
          overlay.html?role=survivor
          overlay.html?role=killer&mode=classes&scale=1.25
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --ov-bg: rgba(11, 12, 15, 0.88);
            --ov-inset: rgba(255, 255, 255, 0.04);
            --ov-border: rgba(255, 255, 255, 0.10);
            --ov-text: #eceae4;
            --ov-muted: #8e95a5;
            --ov-surv: #6ba3be;
            --ov-kill: #b91c28;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: hidden;
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
            color: var(--ov-text);
            -webkit-font-smoothing: antialiased;
        }

        #stage {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 24px;
            padding: 18px 24px;
            margin: 8px;
            background: var(--ov-bg);
            border: 1px solid var(--ov-border);
            border-top: 2px solid var(--ov-surv);
            border-radius: 6px;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
            transform-origin: top left;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #stage.ready { opacity: 1; }
        #stage.v { flex-direction: column; }

        #stage.ov-role-survivor { border-top-color: var(--ov-surv); }
        #stage.ov-role-killer   { border-top-color: var(--ov-kill); }

        .ov-group { display: flex; align-items: flex-start; gap: 16px; }
        .ov-sep { width: 1px; align-self: stretch; background: var(--ov-border); }
        #stage.v .ov-sep { width: auto; height: 1px; align-self: stretch; }

        .ov-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: var(--ov-muted);
        }
        .ov-role-survivor .ov-label.accent,
        .ov-role-survivor .ov-role-tag { color: var(--ov-surv); }
        .ov-role-killer .ov-label.accent,
        .ov-role-killer .ov-role-tag { color: #e0525e; }

        /* Personagem */
        .ov-char { display: flex; flex-direction: column; align-items: center; width: 146px; text-align: center; }
        .ov-char-img {
            width: 142px;
            height: 174px;
            position: relative;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
        }
        .ov-char-img img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .ov-char-name {
            font-family: "Barlow Condensed", sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-top: 6px;
            line-height: 1.05;
            color: var(--ov-text);
        }
        .ov-role-tag {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Perks */
        .ov-perks { display: flex; gap: 12px; }
        .ov-perk { width: 116px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .ov-perk-frame {
            width: 112px;
            height: 112px;
            position: relative;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
        }
        .ov-perk-frame img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .ov-perk-frame img.ov-icon {
            inset: 4%;
            width: 92%;
            height: 92%;
        }

        /* Indicador sóbrio da classe no modo classes */
        .ov-perk-frame.has-class {
            --cc: #888;
            padding-bottom: 5px;
            border-bottom: 2px solid color-mix(in srgb, var(--cc) 80%, transparent);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
        }
        .ov-class-chip {
            --cc: #888;
            display: inline-block;
            margin-top: 5px;
            padding: 2px 8px;
            border-radius: 4px;
            background: color-mix(in srgb, var(--cc) 20%, #0e1015);
            color: var(--ov-text) !important;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid color-mix(in srgb, var(--cc) 55%, transparent);
        }

        .ov-name {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.2;
            margin-top: 6px;
            color: var(--ov-text);
        }
        #stage.nonames .ov-name,
        #stage.nonames .ov-char-name { display: none; }

        /* Item / Add-ons */
        .ov-items { display: flex; gap: 10px; align-items: flex-start; }
        .ov-slot { width: 92px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .ov-box {
            width: 78px;
            height: 78px;
            box-sizing: border-box;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--ov-border);
            background: var(--ov-inset);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ov-box img { width: 100%; height: 100%; object-fit: contain; }
        .ov-box.main { width: 92px; height: 92px; }
        .ov-slot.main { width: 104px; }

        /* Animações */
        .spinning .ov-char-img,
        .spinning .ov-perk-frame,
        .spinning .ov-box { animation: ovSpin 0.12s linear infinite; }
        @keyframes ovSpin {
            0%   { filter: brightness(1.0) blur(0.4px); transform: translateY(0); }
            50%  { filter: brightness(1.3) blur(1.2px); transform: translateY(-2px); }
            100% { filter: brightness(1.0) blur(0.4px); transform: translateY(0); }
        }
        .landed .ov-char-img,
        .landed .ov-perk-frame,
        .landed .ov-box { animation: ovPop 0.35s ease-out; }
        @keyframes ovPop {
            0%   { transform: scale(1.06); filter: brightness(1.3); }
            100% { transform: scale(1);    filter: brightness(1); }
        }

        #err {
            color: #fca5a5;
            font-size: 13px;
            padding: 12px 16px;
            background: rgba(11, 12, 15, 0.9);
            border: 1px solid rgba(185, 28, 40, 0.45);
            border-radius: 6px;
            display: none;
            margin: 8px;
        }
    </style>
</head>
